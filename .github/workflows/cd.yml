name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Copy Helm chart to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "helm/devops-app"
          target: "/home/ubuntu/devops-cicd-k8s-project-3"

      - name: Deploy to Kubernetes
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            export KUBECONFIG=/home/ubuntu/.kube/config

            cd /home/ubuntu/devops-cicd-k8s-project-3

            helm upgrade --install devops-app ./helm/devops-app \
              --set image.tag=${{ github.event.workflow_run.head_sha }}

            kubectl rollout status deployment/devops-app
            kubectl get pods
